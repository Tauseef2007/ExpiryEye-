<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpiryEye - Smart Product Tracker</title>
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ================= AUTH VIEW (LOGIN / SIGNUP) ================= -->
    <div id="auth-view" class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="logo-icon">👁️</span>
                <h2>ExpiryEye</h2>
                <p id="auth-subtitle">Manage your product expiries seamlessly</p>
            </div>

            <!-- LOGIN FORM -->
            <form id="login-form">
                <h3>Login to Your Account</h3>
                <div class="input-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" placeholder="name@example.com" required>
                </div>
                <div class="input-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Login →</button>
                <p class="auth-toggle">Don't have an account? <a href="#" id="show-signup">Sign Up</a></p>
            </form>

            <!-- SIGNUP FORM -->
            <form id="signup-form" style="display: none;">
                <h3>Create New Account</h3>
                <div class="input-group">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" placeholder="E.g. Tauseef" required>
                </div>
                <div class="input-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" placeholder="name@example.com" required>
                </div>
                <div class="input-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Sign Up →</button>
                <p class="auth-toggle">Already have an account? <a href="#" id="show-login">Login</a></p>
            </form>
        </div>
    </div>

    <!-- ================= DASHBOARD VIEW ================= -->
    <div id="dashboard-view" class="app-container" style="display: none;">
        <!-- Navbar Section -->
        <header class="navbar">
            <div class="logo">
                <span class="logo-icon">👁️</span>
                <h2>ExpiryEye</h2>
            </div>
            <div class="user-profile">
                <span id="welcome-msg">Welcome, User</span>
                <button id="logout-btn" class="btn btn-outline-sm">Logout</button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="main-content">
            <p id="app-status" class="app-status" role="status" aria-live="polite"></p>
            <div class="content-header">
                <h3>My Expiry Items</h3>
                <button id="add-item-btn" class="btn btn-primary">+ Add New Item</button>
            </div>

            <!-- Controls: Search, Filter, and Sort -->
            <div class="table-controls">
                <input type="text" id="search-bar" placeholder="🔍 Search items by name...">
                
                <select id="filter-category">
                    <option value="ALL">All Categories</option>
                    <option value="MEDICINE">Medicine 💊</option>
                    <option value="GROCERY">Groceries 🥦</option>
                    <option value="WARRANTY">Warranty 📄</option>
                    <option value="INSURANCE">Insurance 🛡️</option>
                    <option value="VEHICLE_DOCUMENT">Vehicle Document 🚗</option>
                    <option value="MOBILE_WIFI_RECHARGE">Mobile & WiFi Recharge 📱</option>
                    <option value="OTHER">Others 📦</option>
                </select>

                <select id="sort-by">
                    <option value="expiry-asc">Expiry Date (Earliest First)</option>
                    <option value="expiry-desc">Expiry Date (Latest First)</option>
                    <option value="name-asc">Name (A-Z)</option>
                </select>
            </div>

            <!-- ITEMS GRID CONTAINER (Replaced Table with Modern Cards Grid) -->
            <div id="items-grid" class="items-grid-container">
                <!-- Dynamic Item Cards Will Be Injected Here via app.js -->
            </div>
        </main>
    </div>

    <!-- ================= ADD ITEM MODAL ================= -->
    <div id="item-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📦 Add New Expiry Item</h3>
                <span id="close-modal-x" class="close-btn">&times;</span>
            </div>
            
            <form id="add-item-form">
                <div class="input-group">
                    <label for="item-name">Item Name</label>
                    <input type="text" id="item-name" placeholder="e.g. Paracetamol 650, Almond Milk" required>
                </div>

                <div class="input-group">
                    <label for="item-category">Category</label>
                    <select id="item-category" required>
                        <option value="" disabled selected>Select Category...</option>
                        <option value="MEDICINE">Medicine 💊</option>
                        <option value="GROCERY">Groceries 🥦</option>
                        <option value="WARRANTY">Warranty 📄</option>
                        <option value="INSURANCE">Insurance 🛡️</option>
                        <option value="VEHICLE_DOCUMENT">Vehicle Document 🚗</option>
                        <option value="MOBILE_WIFI_RECHARGE">Mobile & WiFi Recharge 📱</option>
                        <option value="OTHER">Others 📦</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="item-expiry">Expiry Date</label>
                    <input type="date" id="item-expiry" required>
                    <div class="quick-date-chips">
                        <button type="button" class="chip-btn" onclick="setQuickDate(7)">+7 Days</button>
                        <button type="button" class="chip-btn" onclick="setQuickDate(30)">+1 Month</button>
                        <button type="button" class="chip-btn" onclick="setQuickDate(90)">+3 Months</button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="item-quantity">Quantity</label>
                    <input type="number" id="item-quantity" value="1" min="1" required>
                </div>

                <div class="input-group">
                    <label for="item-value">Estimated Value (₹)</label>
                    <input type="number" id="item-value" placeholder="e.g. 250" step="0.01">
                </div>

                <div class="input-group">
                    <label for="item-notes">Notes / Reminders</label>
                    <input type="text" id="item-notes" placeholder="e.g. Keep in refrigerator">
                </div>

                <div class="modal-actions">
                    <button type="button" id="close-modal" class="btn btn-outline">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Item →</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Frontend Script Logic -->
    <script src="app.js"></script>
</body>
</html>
